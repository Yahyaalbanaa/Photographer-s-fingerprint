<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - فوتوهب</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="card-header">
                <div class="card-icon">⚽</div>
                <h2 class="card-title">استعادة كلمة المرور</h2>
                <p class="card-subtitle">لا تقلق، يحدث هذا. الرجاء إدخال البريد الإلكتروني المرتبط بحسابك.</p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <button style="font-family: 'segoe UI', 'Traditional Arabic', sans-serif;" type="submit" class="btn btn-primary btn-full">إرسال رابط الإستعادة</button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">
                    تذكرت كلمة المرور؟ 
                    <a href="login.html" class="text-link">تسجيل الدخول</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>

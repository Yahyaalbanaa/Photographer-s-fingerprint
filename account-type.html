<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار نوع الحساب - فوتوهب</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="card-header">
                <h2 class="card-title">اختيار نوع الحساب</h2>
                <p class="card-subtitle">اختر نوع حسابك للبدء</p>
            </div>

            <div class="choice-grid">
                <div class="choice-card" onclick="window.location.href='register-client.html'">
                    <div class="choice-icon">👤</div>
                    <h3 class="choice-title">عميل</h3>
                    <p class="choice-description">ابحث وتواصل مع المصورين الموهوبين لمشاريعك</p>
                    <button style="font-family: 'segoe UI', 'Traditional Arabic', sans-serif;" class="btn btn-primary btn-full">اختيار عميل</button>
                </div>

                <div class="choice-card" onclick="window.location.href='register-photographer.html'">
                    <div class="choice-icon">📷</div>
                    <h3 class="choice-title">مصور</h3>
                    <p class="choice-description">اعرض أعمالك وتواصل مع عملاء جدد</p>
                    <button  style="font-family: 'segoe UI', 'Traditional Arabic', sans-serif;" class="btn btn-primary btn-full">اختيار مصور</button>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted">
                    لديك حساب بالفعل؟ 
                    <a href="login.html" class="text-link">تسجيل الدخول</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>

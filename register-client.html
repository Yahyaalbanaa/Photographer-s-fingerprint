<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب عميل - فوتوهب</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="card-header">
                <div class="card-icon">👤</div>
                <h2 class="card-title">إنشاء حساب عميل</h2>
                <p class="card-subtitle">مرحباً! تابع باسم ادخال بياناتك للتسجيل</p>
            </div>

            <form id="registerClientForm">
                <div class="form-group">
                    <label for="name" class="form-label">الاسم</label>
                    <input 
                        type="text" 
                        id="name" 
                        class="form-input" 
                        placeholder="أدخل اسمك الكامل"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="أدخل بريدك الإلكتروني"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">رقم الهاتف</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        class="form-input" 
                        placeholder="أدخل رقم هاتفك"
                        required
                    >
                </div>

                <p class="text-muted text-sm mt-2 mb-3">
                    ستتلقى استجابة إرسال رمز التحقق عبر رسالة نصية
                </p>
                <div class="form-group" style="margin-top: 24px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" required style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 14px;">
                                بالتسجيل، أنت توافق على 
                                <a href="terms.html" class="text-link">شروط الخدمة</a>
                                و
                                <a href="terms.html" class="text-link">سياسة الخصوصية</a>
                            </span>
                        </label>
                    </div>

                <button type="submit" class="btn btn-primary btn-full">إنشاء الحساب</button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">
                    هل لديك حساب بالفعل؟ 
                    <a href="login.html" class="text-link">تسجيل الدخول</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>

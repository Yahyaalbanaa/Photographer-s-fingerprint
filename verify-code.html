<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال رمز التحقق - فوتوهب</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="card-header">
                <div class="card-icon">🔒</div>
                <h2 class="card-title">إدخال رمز التحقق</h2>
                <p class="card-subtitle">تم إرسال رمز مكون من 6 أرقام إلى <strong>1234****966+</strong></p>
            </div>

            <form id="verifyCodeForm">
                <div class="code-inputs">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code1">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code2">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code3">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code4">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code5">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code6">
                </div>

                <button type="submit" class="btn btn-primary btn-full">تحقق من الرمز</button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">
                    لم يصلك الرمز؟ 
                    <a href="#" class="text-link" id="resendCode">إعادة الإرسال</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
